<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">FaultDebug capture and inspection flow</title>
  <desc id="desc">An instrumented C or C++ target records bounded per-thread events. A local collector reads the trace after exit and writes a fault artifact. The CLI or MCP inspector verifies captured source and reports gaps and event loss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1425"/><stop offset="1" stop-color="#10283b"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d6c5"/><stop offset="1" stop-color="#4e9dff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020914" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#42d6c5"/></marker>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="78" r="170" fill="#168d9f" opacity=".08"/>
  <circle cx="185" cy="460" r="220" fill="#3576cb" opacity=".08"/>
  <text x="72" y="65" fill="#6de2d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">LOCAL C/C++ FAULT EVIDENCE</text>
  <text x="72" y="119" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="700">Trace what happened. Keep the limits visible.</text>
  <text x="72" y="153" fill="#a9bed2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Bounded runtime capture · post-exit collection · source-verified inspection</text>

  <path d="M320 293H355M602 293H637M884 293H919" stroke="url(#glow)" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="196" width="248" height="186" rx="18" fill="#142b40" stroke="#29465e"/>
    <rect x="354" y="196" width="248" height="186" rx="18" fill="#142b40" stroke="#29465e"/>
    <rect x="636" y="196" width="248" height="186" rx="18" fill="#142b40" stroke="#29465e"/>
    <rect x="918" y="196" width="290" height="186" rx="18" fill="#142b40" stroke="#29465e"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="108" cy="234" r="17" fill="#1d4e63"/><text x="108" y="240" text-anchor="middle" fill="#76e4d7" font-size="16" font-weight="700">1</text>
    <text x="136" y="240" fill="#f1f6fc" font-size="18" font-weight="700">Instrument target</text>
    <text x="96" y="282" fill="#b5c7d8" font-size="15">C / C++ program</text>
    <text x="96" y="307" fill="#b5c7d8" font-size="15">CMake + Clang wrappers</text>
    <text x="96" y="350" fill="#6de2d2" font-size="13" font-weight="600">events while process runs</text>

    <circle cx="390" cy="234" r="17" fill="#1d4e63"/><text x="390" y="240" text-anchor="middle" fill="#76e4d7" font-size="16" font-weight="700">2</text>
    <text x="418" y="240" fill="#f1f6fc" font-size="18" font-weight="700">Record bounded trace</text>
    <text x="378" y="282" fill="#b5c7d8" font-size="15">C11 per-thread event rings</text>
    <text x="378" y="307" fill="#b5c7d8" font-size="15">commit markers + module IDs</text>
    <text x="378" y="350" fill="#f3bb79" font-size="13" font-weight="600">overflow stays explicit</text>

    <circle cx="672" cy="234" r="17" fill="#1d4e63"/><text x="672" y="240" text-anchor="middle" fill="#76e4d7" font-size="16" font-weight="700">3</text>
    <text x="700" y="240" fill="#f1f6fc" font-size="18" font-weight="700">Collect after exit</text>
    <text x="660" y="282" fill="#b5c7d8" font-size="15">local launcher + collector</text>
    <text x="660" y="307" fill="#b5c7d8" font-size="15">validated .fault artifact</text>
    <text x="660" y="350" fill="#6de2d2" font-size="13" font-weight="600">no remote upload</text>

    <circle cx="954" cy="234" r="17" fill="#1d4e63"/><text x="954" y="240" text-anchor="middle" fill="#76e4d7" font-size="16" font-weight="700">4</text>
    <text x="982" y="240" fill="#f1f6fc" font-size="18" font-weight="700">Inspect evidence</text>
    <text x="942" y="282" fill="#b5c7d8" font-size="15">CLI or read-only MCP tools</text>
    <text x="942" y="307" fill="#b5c7d8" font-size="15">verified source + Build ID</text>
    <text x="942" y="350" fill="#f3bb79" font-size="13" font-weight="600">gaps are not guessed</text>
  </g>
  <path d="M72 424H1208" stroke="#28445b"/>
  <text x="72" y="459" fill="#9fb5c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Observed records</text>
  <circle cx="62" cy="454" r="4" fill="#6de2d2"/>
  <text x="280" y="459" fill="#9fb5c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Static candidates</text>
  <circle cx="270" cy="454" r="4" fill="#6aa8ff"/>
  <text x="488" y="459" fill="#9fb5c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Unresolved limits</text>
  <circle cx="478" cy="454" r="4" fill="#f3bb79"/>
  <text x="1208" y="459" text-anchor="end" fill="#6de2d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">FAULTDEBUG</text>
</svg>
