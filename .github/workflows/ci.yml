name: faultdebug CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Compile Python sources
        run: python -m compileall -q faultdebug scripts
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel
      - name: Test relative compilation database indexing
        run: |
          python -m pip install --disable-pip-version-check .
          python test/index_linkage.py

  clang18-cmake-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18-tools cmake ninja-build python3
      - name: Configure with Clang 18
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build-ci -G Ninja -DFAULTDEBUG_BUILD_TESTS=ON -DFAULTDEBUG_ENABLE_PROVENANCE=OFF
      - name: Build native fixtures
        run: cmake --build build-ci --parallel 2
      - name: Runtime smoke
        run: |
          python3 -m faultdebug.cli run -- build-ci/test/fd_c_chain 16
          test -x build-ci/test/fd_c_chain
      - name: Record toolchain versions
        run: |
          clang-18 --version
          llvm-symbolizer-18 --version
